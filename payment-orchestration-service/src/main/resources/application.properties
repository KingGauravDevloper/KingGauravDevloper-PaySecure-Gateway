# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/paysecure_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port
server.port=8084

# JWT Config (Matches Auth Service)
jwt.secret=WTI5dFltbHVZWFJwYjI1a2IybHVaMjFsWVd4bGVHTnBkR1Z0Wlc1MGJXRmtaWEJ5YjJKc1pXMXlaV05sYVhabGFXND0=
jwt.expiration=86400000

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.paysecure=DEBUG

# Service URLs
# Fraud Service (Python AI on Port 8001)
services.fraud-detection.url=http://localhost:8001/api/v1/fraud/check

# Bank Adapter (Java on Port 9002)
services.bank-adapter.url=http://localhost:9002/api/payments
