# Application
spring.application.name=transaction-service
server.port=8082

# Database Configuration
# 1. FIXED: Password must be 'root' (to match Docker), not 'your_password'
spring.datasource.url=jdbc:mysql://localhost:3306/paysecure_transaction_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# 2. FIXED: Removed quotes around the secret.
jwt.secret=WTI5dFltbHVZWFJwYjI1a2IybHVaMjFsWVd4bGVHTnBkR1Z0Wlc1MGJXRmtaWEJ5YjJKc1pXMXlaV05sYVhabGFXND0=
jwt.expiration=86400000

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.paysecure.transactionservice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG